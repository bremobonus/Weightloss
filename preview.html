<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM · Body Model Preview</title>
<style>
  :root {
    --bg:#0a041c; --ink:#f5f0ff; --dim:#8c83b8;
    --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font:14px/1.4 -apple-system, system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, rgba(192,77,255,.35), transparent 60%),
                radial-gradient(900px 700px at -10% 10%, rgba(0,212,255,.28), transparent 60%),
                linear-gradient(180deg, #07021a, #0b0428 60%, #120744);
    color: var(--ink); min-height:100vh; padding: 24px;
  }
  h1 { font-weight:800; letter-spacing:.22em; font-size:14px; margin:0 0 4px 0;
       background: linear-gradient(90deg,#ff2d6f,#ff7a1a,#ffd400,#33ff99,#00d4ff,#6a5dff,#c04dff);
       -webkit-background-clip:text; background-clip:text; color:transparent }
  p.lede { color: var(--dim); margin: 0 0 24px 0 }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:18px }
  .card {
    background: rgba(255,255,255,.04); border:1px solid var(--line);
    border-radius: 16px; padding:16px; position:relative;
  }
  .card::before{
    content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(90deg,#ff2d6f,#ff7a1a,#ffd400,#33ff99,#00d4ff,#6a5dff,#c04dff);
    opacity:.35; pointer-events:none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .card h3 { margin: 0 0 2px 0; font-size: 15px }
  .card .meta { color: var(--dim); font-size: 12px; margin-bottom: 10px }
  .card canvas { width:100% !important; height: 360px !important; display:block;
                 border-radius: 10px; background: rgba(0,0,0,.3) }
  .card .err { color: #ff8aa3; font-size: 12px; padding: 10px; background: rgba(255,45,111,.1); border-radius:8px; margin-top:8px }
  .card .pick {
    margin-top: 10px; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg,#ff2d6f,#ff7a1a,#ffd400,#33ff99,#00d4ff,#6a5dff,#c04dff);
    color: #0a0020; border:none; font-weight: 700; font-size: 13px; width: 100%;
  }
  .pick.picked { background: rgba(51,255,153,.25); color: #baffd9 }
  .controls { display:flex; gap:10px; margin-bottom: 20px; flex-wrap: wrap; align-items:center }
  .controls label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing:.12em }
  select, input[type=color] { background: rgba(255,255,255,.08); color: var(--ink);
                              border: 1px solid var(--line); border-radius: 8px; padding:6px 10px }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<h1>PRISM · Body Model Preview</h1>
<p class="lede">Each card loads a different humanoid mesh and renders it as a wireframe. Pick the one that looks best and tell me which you want. Tap "Use this" to preview the choice locally.</p>

<div class="controls">
  <label>Style
    <select id="style">
      <option value="wire">Wireframe all triangles</option>
      <option value="edges" selected>Edges only (cleaner)</option>
      <option value="solid">Solid matte (reference)</option>
    </select>
  </label>
  <label>Color
    <input type="color" id="color" value="#00d4ff" />
  </label>
  <label>Rotate
    <input type="checkbox" id="spin" checked />
  </label>
</div>

<div class="grid" id="grid"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODELS = [
  {
    id: 'xbot',
    name: 'Xbot (Mixamo generic male)',
    meta: '2.9 MB · standard humanoid · T-pose',
    url: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb',
    camY: 1.0, camZ: 2.5,
  },
  {
    id: 'michelle',
    name: 'Michelle (Mixamo female dancer)',
    meta: '3.2 MB · realistic female · T-pose',
    url: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Michelle.glb',
    camY: 1.0, camZ: 2.5,
  },
  {
    id: 'soldier',
    name: 'Soldier (animated)',
    meta: '2.1 MB · male in uniform · animated',
    url: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb',
    camY: 1.0, camZ: 2.5,
  },
  {
    id: 'cesiumman',
    name: 'CesiumMan (walking)',
    meta: '427 KB · low-poly · walking pose',
    url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb',
    camY: 1.0, camZ: 2.5,
  },
  {
    id: 'rigged',
    name: 'RiggedFigure (low-poly)',
    meta: '48 KB · ribbon/stick figure · T-pose',
    url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/RiggedFigure/glTF-Binary/RiggedFigure.glb',
    camY: 0, camZ: 6,
  },
];

const grid = document.getElementById('grid');
const styleSel = document.getElementById('style');
const colorInp = document.getElementById('color');
const spinInp = document.getElementById('spin');

const renderers = [];

function applyMaterial(root, style, colorHex) {
  const color = new THREE.Color(colorHex);
  root.traverse((obj) => {
    if (!obj.isMesh && !obj.isSkinnedMesh) return;
    obj.material = style === 'solid'
      ? new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 })
      : new THREE.MeshBasicMaterial({ color, wireframe: style === 'wire', transparent: true, opacity: 0.9 });
  });
}

function buildCard(model) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${model.name}</h3>
    <div class="meta">${model.meta}</div>
    <canvas></canvas>
    <button class="pick" data-id="${model.id}">Use this</button>
  `;
  grid.appendChild(card);
  const canvas = card.querySelector('canvas');
  const errBox = () => {
    const d = document.createElement('div');
    d.className = 'err';
    card.insertBefore(d, card.querySelector('.pick'));
    return d;
  };

  const renderer = new THREE.WebGLRenderer({canvas, alpha: true, antialias: true});
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  const resize = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  };
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, model.camY, model.camZ);
  camera.lookAt(0, model.camY, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222244, 1));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(-3, 5, 4); scene.add(key);

  const group = new THREE.Group();
  scene.add(group);

  const loader = new GLTFLoader();
  loader.load(model.url, (gltf) => {
    const m = gltf.scene;
    // Pose arms down for T-pose models
    m.traverse((obj) => {
      if (obj.isBone) {
        const n = obj.name;
        if (/LeftArm$/.test(n))       obj.rotation.z = -1.25;
        else if (/RightArm$/.test(n)) obj.rotation.z =  1.25;
      }
    });
    applyMaterial(m, styleSel.value, colorInp.value);
    // Fit: scale to target height 1.8
    m.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3());
    if (size.y > 0.01) {
      const scale = 1.8 / size.y;
      m.scale.setScalar(scale);
    }
    m.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(m);
    const c2 = box2.getCenter(new THREE.Vector3());
    m.position.sub(c2);
    m.position.y += 0.9;
    group.add(m);
    model._loadedModel = m;
  }, undefined, (err) => {
    const e = errBox();
    e.textContent = 'Failed to load: ' + (err?.message || err);
  });

  renderers.push({renderer, scene, camera, group, resize, model});

  const resizeAll = () => renderers.forEach(r => r.resize());
  window.addEventListener('resize', resizeAll);
  resize();
}

MODELS.forEach(buildCard);

// Control changes — re-apply
function reapply() {
  renderers.forEach(r => {
    if (r.model._loadedModel) applyMaterial(r.model._loadedModel, styleSel.value, colorInp.value);
  });
}
styleSel.addEventListener('change', reapply);
colorInp.addEventListener('input', reapply);

// Animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  renderers.forEach(({renderer, scene, camera, group}) => {
    if (spinInp.checked) group.rotation.y = t * 0.4;
    renderer.render(scene, camera);
  });
}
animate();

// Picker
grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.pick');
  if (!btn) return;
  const id = btn.dataset.id;
  localStorage.setItem('prism_body_model', id);
  document.querySelectorAll('.pick').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');
  btn.textContent = '✓ Picked — tell me "use ' + id + '" in chat';
});
</script>
</body>
</html>
